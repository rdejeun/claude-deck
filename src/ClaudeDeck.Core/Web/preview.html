<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu ClaudeDeck</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b1d22; font: 14px system-ui, sans-serif; color: #9aa1ad; }
  .deck { background: #050506; border-radius: 22px; padding: 18px; display: grid; grid-template-columns: repeat(3, 160px); gap: 16px;
          box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  button { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 14px; overflow: hidden; width: 160px; height: 160px; }
  button:active { transform: scale(.96); }
  img { width: 100%; height: 100%; display: block; }
  p { text-align: center; margin-top: 14px; }
  @media (max-width: 560px) { .deck { grid-template-columns: repeat(3, 28vw); gap: 3vw; } button { width: 28vw; height: 28vw; } }
</style>
</head>
<body>
<div>
  <div class="deck" id="deck"></div>
  <p>Aperçu en direct — <a href="/settings" style="color:#6aa0ff">réglages</a></p>
</div>
<script>
const H = { "X-ClaudeDeck-Token": "{{TOKEN}}" };
const deck = document.getElementById("deck");
for (let i = 0; i < 6; i++) {
  const b = document.createElement("button");
  b.innerHTML = `<img alt="Touche ${i + 1}" src="/key/${i}.png">`;
  b.onclick = () => fetch("/api/press/" + i, { method: "POST", headers: H });
  deck.appendChild(b);
}
let version = -1;
async function poll() {
  try {
    const r = await fetch("/api/state", { headers: H });
    if (r.ok) {
      const s = await r.json();
      if (s.version !== version) {
        version = s.version;
        deck.querySelectorAll("img").forEach((img, i) => img.src = `/key/${i}.png?v=${version}`);
      }
    }
  } catch { }
  setTimeout(poll, 250);
}
poll();
</script>
</body>
</html>
