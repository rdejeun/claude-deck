name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Tests
        run: dotnet test tests/ClaudeDeck.Tests -c Release

      - name: Publication (exe unique win-x64)
        run: dotnet publish src/ClaudeDeck -c Release -o publish

      - name: Archive
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md publish/
          Compress-Archive -Path publish/* -DestinationPath claude-deck-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: claude-deck-win-x64
          path: publish/

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: claude-deck-win-x64.zip
          generate_release_notes: true

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/ClaudeDeck.Tests -c Release
      - run: dotnet build src/ClaudeDeck -c Release
